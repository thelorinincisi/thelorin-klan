    <style>
        :root { --bg-color: #07070a; --card-bg: rgba(18, 14, 28, 0.75); --neon-purple: #9d00ff; --neon-cyan: #00f3ff; --text-main: #f0ebf8; --text-muted: #a399b5; --success: #00ff66; --danger: #ff0055; }
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { background-color: var(--bg-color); color: var(--text-main); font-family: 'Rajdhani', sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; background-image: radial-gradient(circle at 50% 0%, rgba(157, 0, 255, 0.15), transparent 50%), radial-gradient(circle at 80% 80%, rgba(0, 243, 255, 0.08), transparent 40%); background-attachment: fixed; }
        
        /* UI Elementler & Hamburger */
        .top-bar { width: 100%; max-width: 800px; display: flex; justify-content: space-between; align-items: center; padding: 10px 0; position: relative; z-index: 100; }
        .menu-btn { font-size: 2rem; color: var(--neon-cyan); cursor: pointer; background: rgba(18, 14, 28, 0.8); border: 1px solid var(--neon-purple); padding: 5px 15px; border-radius: 12px; box-shadow: 0 0 15px rgba(157, 0, 255, 0.4); transition: all 0.3s ease; }
        .menu-btn:hover { transform: scale(1.05); box-shadow: 0 0 20px var(--neon-cyan); }
        .founder-btn-container { position: relative; }
        .founder-btn { width: 52px; height: 52px; border-radius: 50%; background: linear-gradient(135deg, var(--neon-purple), var(--neon-cyan)); padding: 2px; cursor: pointer; box-shadow: 0 0 15px rgba(157, 0, 255, 0.6); transition: all 0.3s ease; display: flex; align-items: center; justify-content: center; }
        .founder-btn img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; background-color: #111; }
        
        /* Sidebar */
        .sidebar { position: fixed; top: 0; left: -300px; width: 280px; height: 100%; background: rgba(10, 8, 18, 0.98); border-right: 2px solid var(--neon-purple); box-shadow: 10px 0 30px rgba(0, 0, 0, 0.9); z-index: 1000; transition: left 0.3s ease; padding: 20px; display: flex; flex-direction: column; gap: 20px; backdrop-filter: blur(15px); }
        .sidebar.open { left: 0; }
        .sidebar-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 15px; }
        .sidebar-title { font-family: 'Orbitron', sans-serif; color: var(--neon-cyan); font-size: 1.2rem; font-weight: bold; }
        .close-btn { font-size: 1.8rem; color: var(--danger); cursor: pointer; }
        .nav-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }
        .nav-item { padding: 12px 15px; border-radius: 8px; cursor: pointer; font-size: 1.1rem; font-weight: 600; color: var(--text-main); background: rgba(255, 255, 255, 0.03); border-left: 3px solid transparent; transition: all 0.2s ease; display: flex; align-items: center; gap: 10px; }
        .nav-item:hover, .nav-item.active { background: rgba(157, 0, 255, 0.15); border-left-color: var(--neon-cyan); color: var(--neon-cyan); transform: translateX(5px); }
