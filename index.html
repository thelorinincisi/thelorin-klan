<!DOCTYPE html>
<!-- THELORİN OTONOM V5 SİSTEMİ (Güncellenmiş Sıralama) -->
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THELORİN KLAN PORTALI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #07070a;
            --card-bg: rgba(18, 14, 28, 0.75);
            --neon-purple: #9d00ff;
            --neon-cyan: #00f3ff;
            --text-main: #f0ebf8;
            --text-muted: #a399b5;
            --success: #00ff66;
            --danger: #ff0055;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(157, 0, 255, 0.15), transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(0, 243, 255, 0.08), transparent 40%);
            background-attachment: fixed;
        }

        /* Top Bar: Hamburger Menu & Founder Button */
        .top-bar {
            width: 100%;
            max-width: 800px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            position: relative;
            z-index: 100;
        }

        .menu-btn {
            font-size: 2rem;
            color: var(--neon-cyan);
            cursor: pointer;
            background: rgba(18, 14, 28, 0.8);
            border: 1px solid var(--neon-purple);
            padding: 5px 15px;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(157, 0, 255, 0.4);
            transition: all 0.3s ease;
        }

        .menu-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px var(--neon-cyan);
        }

        /* Founder Button */
        .founder-btn-container { position: relative; }
        .founder-btn {
            width: 52px; height: 52px; border-radius: 50%;
            background: linear-gradient(135deg, var(--neon-purple), var(--neon-cyan));
            padding: 2px; cursor: pointer;
            box-shadow: 0 0 15px rgba(157, 0, 255, 0.6);
            transition: all 0.3s ease; display: flex; align-items: center; justify-content: center;
        }
        .founder-btn:hover { transform: scale(1.1); box-shadow: 0 0 25px var(--neon-cyan); }
        .founder-btn img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; background-color: #111; }
        .founder-btn .fallback-icon { display: none; font-size: 1.5rem; color: #fff; text-shadow: 0 0 8px var(--neon-purple); }
        .founder-popup {
            position: absolute; top: 64px; right: 0; background: rgba(10, 8, 18, 0.95);
            border: 1px solid var(--neon-cyan); padding: 12px 20px; border-radius: 12px;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.3); white-space: nowrap; display: none;
            flex-direction: column; align-items: center; gap: 4px; animation: fadeIn 0.3s ease; backdrop-filter: blur(10px);
        }
        .founder-popup.show { display: flex; }
        .founder-title { font-size: 0.75rem; color: var(--neon-cyan); letter-spacing: 2px; text-transform: uppercase; }
        .founder-name { font-family: 'Orbitron', sans-serif; font-size: 1.1rem; font-weight: 700; color: #fff; text-shadow: 0 0 8px var(--neon-purple); }

        /* Sidebar (Yan Menü) */
        .sidebar {
            position: fixed;
            top: 0; left: -300px;
            width: 280px; height: 100%;
            background: rgba(10, 8, 18, 0.98);
            border-right: 2px solid var(--neon-purple);
            box-shadow: 10px 0 30px rgba(0, 0, 0, 0.9);
            z-index: 1000;
            transition: left 0.3s ease;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            backdrop-filter: blur(15px);
        }

        .sidebar.open { left: 0; }

        .sidebar-header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 15px;
        }
        .sidebar-title { font-family: 'Orbitron', sans-serif; color: var(--neon-cyan); font-size: 1.2rem; font-weight: bold; }
        .close-btn { font-size: 1.8rem; color: var(--danger); cursor: pointer; }

        .nav-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }
        .nav-item {
            padding: 12px 15px; border-radius: 8px; cursor: pointer;
            font-size: 1.1rem; font-weight: 600; color: var(--text-main);
            background: rgba(255, 255, 255, 0.03); border-left: 3px solid transparent;
            transition: all 0.2s ease; display: flex; align-items: center; gap: 10px;
        }
        .nav-item:hover, .nav-item.active {
            background: rgba(157, 0, 255, 0.15); border-left-color: var(--neon-cyan); color: var(--neon-cyan);
            transform: translateX(5px);
        }

        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6); z-index: 999; display: none;
            backdrop-filter: blur(3px);
        }
        .overlay.show { display: block; }

        /* Header Section */
        header { text-align: center; margin-top: 10px; margin-bottom: 35px; }
        .clan-logo { width: 150px; height: 150px; margin: 0 auto 10px; position: relative; display: flex; align-items: center; justify-content: center; }
        .logo-img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 0 15px var(--neon-purple)) drop-shadow(0 0 25px var(--neon-cyan)); animation: pulse 3s infinite alternate; }
        h1 { font-family: 'Orbitron', sans-serif; font-size: 3.5rem; font-weight: 900; letter-spacing: 8px; text-transform: uppercase; background: linear-gradient(90deg, var(--neon-purple), #fff, var(--neon-cyan)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-shadow: 0 0 30px rgba(157, 0, 255, 0.5); }

        /* Main Container & Tabs */
        .container { width: 100%; max-width: 800px; display: flex; flex-direction: column; gap: 30px; }
        
        .tab-content { display: none; animation: fadeIn 0.4s ease; }
        .tab-content.active { display: flex; flex-direction: column; gap: 30px; }

        /* Card Styles */
        .card {
            background: var(--card-bg); border-radius: 16px; padding: 25px;
            border: 1px solid rgba(157, 0, 255, 0.3); box-shadow: 0 0 25px rgba(0, 0, 0, 0.8), inset 0 0 15px rgba(157, 0, 255, 0.1);
            position: relative; overflow: hidden; backdrop-filter: blur(8px);
        }
        .card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent, var(--neon-purple), var(--neon-cyan), transparent); }
        .card-title { font-family: 'Orbitron', sans-serif; font-size: 1.3rem; color: var(--neon-cyan); margin-bottom: 20px; display: flex; align-items: center; gap: 10px; letter-spacing: 2px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 10px; }

        /* 🏆 Kürsü (Podium) CSS Ayarları */
        .podium-container { display: flex; justify-content: center; align-items: flex-end; gap: 15px; margin: 10px auto 20px auto; max-width: 600px; height: 180px; }
        .podium { display: flex; flex-direction: column; justify-content: flex-start; align-items: center; width: 30%; border-radius: 10px 10px 0 0; padding-top: 15px; transition: transform 0.3s ease; }
        .podium:hover { transform: translateY(-10px); }
        .rank { font-size: 35px; margin-bottom: 5px; filter: drop-shadow(0 0 10px rgba(255,255,255,0.2)); }
        .name { font-size: 16px; font-weight: 700; margin-bottom: 5px; color: #fff; word-break: break-all; text-align: center; font-family: 'Orbitron', sans-serif;}
        .xp { font-size: 13px; font-weight: 700; background: rgba(0,0,0,0.5); padding: 4px 8px; border-radius: 5px; color: var(--neon-cyan); border: 1px solid rgba(0, 243, 255, 0.3);}
        
        .p2 { height: 65%; background: linear-gradient(to top, rgba(42,42,42,0.8), rgba(192,192,192,0.8)); border-top: 3px solid silver; box-shadow: 0 0 20px rgba(192,192,192,0.15);}
        .p1 { height: 85%; background: linear-gradient(to top, rgba(58,42,0,0.8), rgba(255,215,0,0.8)); border-top: 3px solid gold; box-shadow: 0 -5px 25px rgba(255,215,0,0.3); z-index: 10; }
        .p3 { height: 50%; background: linear-gradient(to top, rgba(42,21,5,0.8), rgba(205,127,50,0.8)); border-top: 3px solid #cd7f32; box-shadow: 0 0 20px rgba(205,127,50,0.15);}

        /* Rules Section */
        .rules-list { list-style: none; display: flex; flex-direction: column; gap: 15px; }
